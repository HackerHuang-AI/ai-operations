server.port=8060
app.environment=prod
app.debug=false

# ==================== 日志配置 ====================
logging.file.path=logs
logging.level.root=WARN
logging.level.com.ai.operations=INFO

# ==================== Nacos 配置中心 ====================
# 部署平台在启动前注入 Nacos 凭据；未注入时使用本地 prod 账号，便于本地调试。
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR}
spring.cloud.nacos.config.namespace=prod
spring.cloud.nacos.config.username=${SPRING_CLOUD_NACOS_CONFIG_USERNAME:ai-operations-prod}
spring.cloud.nacos.config.password=${SPRING_CLOUD_NACOS_CONFIG_PASSWORD:ai-operations-nacos-local123-prod}
spring.cloud.nacos.config.import-check.enabled=false

# ==================== Nacos 服务注册与发现 ====================
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR}
spring.cloud.nacos.discovery.namespace=${spring.cloud.nacos.config.namespace}
spring.cloud.nacos.discovery.username=${SPRING_CLOUD_NACOS_DISCOVERY_USERNAME:ai-operations-prod}
spring.cloud.nacos.discovery.password=${SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD:ai-operations-nacos-local123-prod}

# ==================== Dubbo ====================
dubbo.registry.address=nacos://${spring.cloud.nacos.discovery.server-addr}
# Spring Cloud Nacos 承担应用配置；未使用 Dubbo Config Center，避免读取其默认公共 DataId。
dubbo.config-center.enabled=false
# 元数据中心在当前环境共享：ai-admin 存储服务定义，mapping 存储接口到应用的映射。
dubbo.metadata-report.address=nacos://${spring.cloud.nacos.config.server-addr}
dubbo.metadata-report.group=ai-admin
dubbo.metadata-report.parameters.namespace=${spring.cloud.nacos.config.namespace}
# Dubbo 与 Nacos 共用启动前注入、并由 Vault 保存的应用凭据。
dubbo.registry.username=${spring.cloud.nacos.discovery.username}
dubbo.registry.password=${spring.cloud.nacos.discovery.password}
dubbo.metadata-report.username=${spring.cloud.nacos.config.username}
dubbo.metadata-report.password=${spring.cloud.nacos.config.password}

# ==================== Vault ====================
# Nacos 使用启动前注入的同一套应用凭据加载基础配置，随后 Vault 补充运行期密钥。
spring.config.import=optional:nacos:ai-operations.properties?group=ai-operations,optional:vault://
spring.cloud.vault.enabled=true
spring.cloud.vault.host=${VAULT_HOST}
spring.cloud.vault.port=${VAULT_PORT}
spring.cloud.vault.scheme=${VAULT_SCHEME:https}
spring.cloud.vault.authentication=APPROLE
# 部署平台注入 Vault AppRole；未注入时使用当前本地默认值，便于本地调试。
spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID:acd659f9-ee05-28cd-bc53-223d66463cfe}
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID:082c2b40-3e62-b462-5399-80837f213b88}
spring.cloud.vault.app-role.app-role-path=approle
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=
spring.cloud.vault.kv.application-name=${spring.application.name}/${spring.profiles.active}
spring.cloud.vault.kv.profiles=

# ==================== Redis Cluster（凭据由 Vault 注入）====================
spring.data.redis.cluster.nodes=${REDIS_CLUSTER_NODES}
spring.data.redis.lettuce.cluster.refresh.adaptive=true
spring.cache.redis.key-prefix=ai-admin:ai-operations:
spring.cache.redis.use-key-prefix=true

# ==================== MySQL（凭据由 Vault 注入）====================
spring.datasource.url=${MYSQL_JDBC_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

